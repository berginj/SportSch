name: Manual SWA Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      NODE_VERSION: "22.20.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: true
          lfs: false
      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install UI dependencies
        run: npm ci
      - name: Lint application
        run: npm run lint
      - name: Full UI regression suite
        run: npm run test:ci
      - name: Start local storage emulator
        uses: ./.github/actions/start-test-storage
      - name: Full backend regression suite
        run: dotnet test api/GameSwap.Tests/GameSwap.Tests.csproj
        env:
          GAMESWAP_STORAGE_TESTS: "1"
      - name: Verify production UI build
        run: npm run build
      - name: Browser regression
        uses: ./.github/actions/browser-regression
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_MEADOW_08081740F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          skip_deploy_on_missing_secrets: true
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          app_build_command: "npm run build"
          api_build_command: "dotnet publish -c Release"
